<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tools · Every everyday tool, in your browser</title>
  <meta name="description" content="Free, private online tools for PDFs, images, video, data, text, calculators and more. Most run entirely in your browser.">
  <meta name="theme-color" content="#fbfbfd">
  <meta property="og:title" content="Tools · Every everyday tool, in your browser">
  <meta property="og:description" content="Hundreds of free tools for PDFs, images, video, data, text, calculators, India forms and AI. Files stay on your device.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Tools">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
  <script>try { if (JSON.parse(localStorage.getItem('tools:theme')) === 'dark') document.documentElement.dataset.theme = 'dark' } catch (e) {}</script>
  <script defer crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/lucide@1.47.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <div id="scroll-progress" aria-hidden="true"></div>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="Tools home">
        <span class="brand-mark" data-icon="wrench"></span>
        <span>Tools</span>
      </a>
      <div class="header-spacer"></div>
      <button class="search-trigger" id="search-open" type="button" aria-label="Search tools">
        <span data-icon="search"></span><span class="label">Search tools...</span><kbd>Ctrl K</kbd>
      </button>
      <button class="icon-btn" id="install-app" type="button" aria-label="Install app" title="Install as an app" hidden><span data-icon="download"></span></button>
      <button class="icon-btn" id="ai-open" type="button" aria-label="AI settings" title="AI settings"><span data-icon="sparkles"></span></button>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <div id="route-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <footer class="site-footer">
    <div class="footer-inner">
      <span><strong>Tools</strong> · <span id="footer-count"></span> · Most tools run entirely in your browser; files never leave your device.</span>
    </div>
  </footer>
  <noscript><p style="padding:24px;text-align:center">These tools run in your browser and need JavaScript.</p></noscript>
</body>
</html>
